  <path d="M432 425 C540 412 622 373 688 307" fill="none" stroke="#789288" stroke-width="17" stroke-linecap="round"/>
  <path d="M476 263 C423 227 394 193 379 150" fill="none" stroke="#9aaca4" stroke-width="12" stroke-linecap="round" stroke-dasharray="6 18"/>
  <path d="M240 185 C203 170 169 151 144 120" fill="none" stroke="#9aaca4" stroke-width="12" stroke-linecap="round" stroke-dasharray="6 18"/>
  <path d="M185 350 C142 325 115 294 94 253" fill="none" stroke="#9aaca4" stroke-width="12" stroke-linecap="round" stroke-dasharray="6 18"/>
  <path d="M654 135 C688 114 719 99 756 95" fill="none" stroke="#9aaca4" stroke-width="12" stroke-linecap="round" stroke-dasharray="6 18"/>
  <circle cx="144" cy="120" r="17" fill="#cbd5d0"/>
  <circle cx="379" cy="150" r="17" fill="#cbd5d0"/>
  <circle cx="94" cy="253" r="17" fill="#cbd5d0"/>
  <circle cx="756" cy="95" r="17" fill="#cbd5d0"/>
  <circle cx="688" cy="307" r="22" fill="#38a169"/>
  <circle cx="688" cy="307" r="10" fill="#d9f99d"/>
  <text x="710" y="293" fill="#216947" font-family="Arial, sans-serif" font-size="19" font-weight="700">VIABLE</text>
  <text x="710" y="319" fill="#527169" font-family="Arial, sans-serif" font-size="17">solution found</text>
  <rect x="810" y="194" width="300" height="260" rx="14" fill="#ffffff" stroke="#bfd1c3" stroke-width="3"/>
  <circle cx="960" cy="309" r="74" fill="#e7f3ea" stroke="#216947" stroke-width="8"/>
  <path d="M960 263 V311 L996 334" fill="none" stroke="#216947" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="860" y="407" fill="#183b34" font-family="Arial, sans-serif" font-size="24" font-weight="700">TIME TO LEARN</text>
  <text x="853" y="435" fill="#527169" font-family="Arial, sans-serif" font-size="17">is the useful success metric</text>
  <text x="108" y="586" fill="#788d84" font-family="Arial, sans-serif" font-size="18">EXPLORED PATHS</text>
  <path d="M282 579 H327" stroke="#789288" stroke-width="12" stroke-linecap="round"/>
