<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Measuring success in data science</title>
  <desc id="description">A branching data-science exploration tree with a clock, showing that efficient learning across many paths defines success.</desc>
  <rect width="1200" height="630" fill="#f7faf7"/>
  <path d="M0 530 H1200" stroke="#d1ddd3" stroke-width="4"/>
  <text x="75" y="93" fill="#183b34" font-family="Arial, sans-serif" font-size="42" font-weight="700">MEASURING SUCCESS</text>
  <text x="75" y="133" fill="#527169" font-family="Arial, sans-serif" font-size="22">Explore broadly. Learn quickly. Avoid needless rework.</text>
